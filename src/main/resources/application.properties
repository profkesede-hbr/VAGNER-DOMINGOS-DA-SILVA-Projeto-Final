spring.application.name=doc-emed

# ─── BANCO DE DADOS (Instância MariaDB Doc-eMed Isolada na porta 3307) ───────
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/docemed?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=docemed_user
spring.datasource.password=docemed@2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / HIBERNATE ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ─── SERIALIZAÇÃO ─────────────────────────────────────────────────────────────
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo