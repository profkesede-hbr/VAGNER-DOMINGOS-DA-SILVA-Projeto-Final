spring.application.name=doc-emed

# ─── BANCO DE DADOS ────────────────────────────────────────────────────────────
# Substitua pelas suas credenciais do Aiven Cloud ou MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/docemed?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=

# ─── JPA / HIBERNATE ──────────────────────────────────────────────────────────
# update → cria/atualiza tabelas automaticamente; usar 'validate' em produção
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── SERIALIZAÇÃO ─────────────────────────────────────────────────────────────
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo