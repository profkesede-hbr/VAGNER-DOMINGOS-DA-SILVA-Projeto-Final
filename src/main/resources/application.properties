spring.application.name=doc-emed

# ─── PERFIL ATIVO ─────────────────────────────────────────────────────────────
spring.profiles.active=local

# ─── BANCO DE DADOS (Configurado via application-local.properties ou Env Vars) ───
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/docemed?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:docemed_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / HIBERNATE ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ─── SERIALIZAÇÃO ─────────────────────────────────────────────────────────────
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo